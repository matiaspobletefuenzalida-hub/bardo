<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bardo RPG Retro - Sprite Transparente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Fondo oscuro neutro para dar contraste al pixel art transparente */
            background-color: #16161a; 
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            /* Escalado del canvas base (128x64) x4 para excelente nitidez pixel-art */
            width: 512px; 
            height: 256px;
            background: transparent; 
        }

        #bard-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* Controles de UI */
        #controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 20;
        }

        button {
            background-color: #4CAF50;
            border: 2px solid #2E7D32;
            color: white;
            padding: 8px 16px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px #1B5E20;
            transition: all 0.1s;
        }

        button:active {
            box-shadow: 0 0 #1B5E20;
            transform: translateY(4px);
        }
        
        button.active-state {
            background-color: #FF9800;
            border-color: #E65100;
            box-shadow: 0 2px #E65100;
            transform: translateY(2px);
        }
        
        .ui-text {
            margin-bottom: 10px;
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>

    <div class="ui-text">Bardo: <span id="current-state-text" class="text-yellow-400 font-bold">Idle Tranquilo</span> | Poodle: <span id="poodle-state-text" class="text-amber-300 font-bold">Acostado</span></div>
    
    <div id="game-container">
        <canvas id="bard-canvas" width="128" height="64"></canvas>
    </div>

    <div id="controls">
        <button id="btn-dormido" onclick="setAnimationState('dormido')">Dormido</button>
        <button id="btn-despertar" onclick="setAnimationState('despertar')">Despertar</button>
        <button id="btn-idle" class="active-state" onclick="setAnimationState('idle')">Idle Tranquilo</button>
        <button id="btn-normal" onclick="setAnimationState('normal')">Tocando Normal</button>
        <button id="btn-alegre" onclick="setAnimationState('alegre')">Taberna Alegre</button>
        <button id="btn-epica" onclick="setAnimationState('epica')">CanciÃ³n Ã‰pica</button>
        <button id="btn-nostalgica" onclick="setAnimationState('nostalgica')">NostÃ¡lgica</button>
    </div>

    <script>
        const canvas = document.getElementById('bard-canvas');
        const ctx = canvas.getContext('2d');
        const stateText = document.getElementById('current-state-text');
        const buttons = document.querySelectorAll('#controls button');

        const colors = {
            outline: '#1a1c2c',
            skinDark: '#c88267', 
            skinLight: '#eec39a',
            hair: '#5d544c', 
            stubble: '#7a6a5f',
            hatDark: '#2c3e2e', 
            hatLight: '#4b6947',
            featherDark: '#9e2835',
            featherLight: '#d95763',
            shirtDark: '#b2b5b3',
            shirtLight: '#f4f4f4',
            vestDark: '#5c4033',
            vestLight: '#8b5a2b',
            belt: '#1a1c2c',
            buckle: '#f4b41b',
            capeDark: '#224c2e',
            capeLight: '#347c47', 
            pants: '#2b2b36',
            bootsDark: '#362222',
            bootsLight: '#593e36',
            luteDark: '#754020',
            luteWood: '#bd6a35',
            luteHole: '#1a1c2c',
            strings: '#eec39a',
            
            benchTop: '#8d6e63',
            benchFront: '#5d4037',
            benchLegs: '#3e2723',
            
            stoneDark: '#4a4a4f',
            stoneLight: '#747480',
            woodLog: '#4d2b18',
            woodLogLight: '#754020',
            fireRed: '#cb4d4d',
            fireOrange: '#d9813b',
            fireYellow: '#edd55e',
            fireWhite: '#fffde7',

            // Colores cÃ¡lidos y carismÃ¡ticos para el Poodle
            dogDark: '#a3713f',
            dogLight: '#cc964e',
            dogHighlight: '#e6bd75',
            dogNose: '#301d1d',
            dogTongue: '#e57373', 
            treeBarkDark: '#2b1a12',
            treeBark: '#4a2b18',
            treeBarkLight: '#6f4728',
            treeLeafDark: '#182a19',
            treeLeaf: '#254327',
            treeLeafLight: '#38623a',
            treeLeafGold: '#516b35',
            rainDrop: 'rgba(166, 210, 230, 0.72)',

            fluteDark: '#d4e157',
            fluteLight: '#f4ff81',
            drumBase: '#795548',
            drumTop: '#ffe082',
            drumStick: '#5d4037'
        };

        let currentState = 'idle';
        let currentFrame = 0;
        let animationTimer = 0;
        let lastTime = 0;
        let currentInstrument = 'lute'; 

        // Variables de comportamiento del perro
        let dogState = 'lying'; // 'lying' (acostado), 'standing' (pararse)
        let dogTimer = 0;
        let dogTailWag = 0;
        const dogAI = {
            action: 'rest',
            actionLeft: 0,
            nextAction: 7000 + Math.random() * 9000,
            earFlick: 0,
            dreamLeft: 0,
            eyePeek: 0,
            xOffset: 0,
            targetOffset: 0
        };

        // Pool de partÃ­culas y conteo de cuadros
        let particles = [];
        let frameCounter = 0;
        let rainActive = false;
        let visible = true;

        // Micro-vida del bardo: no cambia estados ni silueta, solo detalles de 1px.
        const bardLife = {
            time: 0,
            breathRate: 360,
            breathDepth: 0.4,
            breathTarget: 0.4,
            breathHold: 0,
            blinkTimer: 1200 + Math.random() * 2600,
            blinkLeft: 0,
            blinkStep: 0,
            lookTimer: 1800 + Math.random() * 3200,
            eyeLook: 0,
            eventTimer: 20000 + Math.random() * 40000,
            eventType: null,
            eventLeft: 0,
            forcedEvent: null,
            featherLag: 0,
            capeDrift: 0,
            fingerTap: 0,
            postureBias: 0,
            hatAdjust: 0,
            musicMood: 'calma',
            rainDropLeft: 0,
            restLeft: 0
        };

        const sessionMemory = {
            startedAt: Date.now(),
            openedGames: {},
            music: {},
            weatherChanges: 0,
            lastPromptAt: 0
        };

        function randRange(min, max) {
            return min + Math.random() * (max - min);
        }

        function chooseWeighted(items) {
            const total = items.reduce((sum, item) => sum + item.weight, 0);
            let pick = Math.random() * total;
            for (const item of items) {
                pick -= item.weight;
                if (pick <= 0) return item.value;
            }
            return items[items.length - 1].value;
        }

        function startBardEvent(type, duration) {
            bardLife.eventType = type;
            bardLife.eventLeft = duration || randRange(1600, 4200);
            bardLife.eventTimer = randRange(14000, 52000);
        }

        function updateBardMicroLife(deltaTime) {
            bardLife.time += deltaTime;

            if (bardLife.breathHold > 0) {
                bardLife.breathHold -= deltaTime;
            } else if (Math.random() < 0.003) {
                bardLife.breathTarget = randRange(0.25, Math.random() < 0.18 ? 0.85 : 0.55);
                bardLife.breathRate = randRange(330, 520);
                if (Math.random() < 0.12) bardLife.breathHold = randRange(350, 900);
            }
            bardLife.breathDepth += (bardLife.breathTarget - bardLife.breathDepth) * 0.015;

            bardLife.blinkTimer -= deltaTime;
            if (bardLife.blinkTimer <= 0 && bardLife.blinkLeft <= 0) {
                bardLife.blinkLeft = Math.random() < 0.16 ? 2 : 1;
                bardLife.blinkStep = 95;
                bardLife.blinkTimer = randRange(2200, 7200);
            }
            if (bardLife.blinkLeft > 0) {
                bardLife.blinkStep -= deltaTime;
                if (bardLife.blinkStep <= 0) {
                    bardLife.blinkLeft--;
                    bardLife.blinkStep = bardLife.blinkLeft > 0 ? 135 : 0;
                }
            }

            bardLife.lookTimer -= deltaTime;
            if (bardLife.lookTimer <= 0) {
                const r = Math.random();
                bardLife.eyeLook = r < 0.35 ? -1 : (r < 0.7 ? 1 : 0);
                bardLife.lookTimer = randRange(900, 4200);
            }

            bardLife.eventTimer -= deltaTime;
            if (bardLife.eventTimer <= 0 && bardLife.eventLeft <= 0) {
                if (rainActive && Math.random() < 0.28) {
                    startBardEvent(chooseWeighted([
                        { value: 'rainLook', weight: 3 },
                        { value: 'cloak', weight: 3 },
                        { value: 'fire', weight: 2 },
                        { value: 'raindrop', weight: 1 }
                    ]), randRange(1800, 4200));
                    if (bardLife.eventType === 'raindrop') bardLife.rainDropLeft = 900;
                } else {
                    startBardEvent(chooseWeighted([
                        { value: 'fire', weight: 3 },
                        { value: 'dog', weight: 3 },
                        { value: 'user', weight: 2 },
                        { value: 'smile', weight: 2 },
                        { value: 'sigh', weight: 2 },
                        { value: 'hat', weight: 2 },
                        { value: 'posture', weight: 2 },
                        { value: 'hands', weight: 2 },
                        { value: 'rest', weight: 1 },
                        { value: 'enjoy', weight: 2 }
                    ]), randRange(1500, 5200));
                    if (bardLife.eventType === 'rest') bardLife.restLeft = bardLife.eventLeft;
                }
            }
            if (bardLife.eventLeft > 0) {
                bardLife.eventLeft -= deltaTime;
                if (bardLife.rainDropLeft > 0) bardLife.rainDropLeft -= deltaTime;
                if (bardLife.restLeft > 0) bardLife.restLeft -= deltaTime;
                if (bardLife.eventLeft <= 0) {
                    bardLife.eventType = null;
                    bardLife.postureBias = 0;
                    bardLife.hatAdjust = 0;
                }
            }

            const fingerRate = bardLife.musicMood === 'alegre' ? 80 : (bardLife.musicMood === 'epica' ? 70 : 130);
            bardLife.fingerTap = bardLife.eventType === 'rest' ? 0 : (Math.sin(bardLife.time / fingerRate) > 0.35 ? 1 : 0);
            bardLife.capeDrift = Math.round(Math.sin(bardLife.time / 820) * 0.6);
            bardLife.postureBias = bardLife.eventType === 'posture' ? Math.round(Math.sin(bardLife.time / 540)) : 0;
            bardLife.hatAdjust = (bardLife.eventType === 'hat' || bardLife.eventType === 'raindrop') ? 1 : 0;
        }

        function updateDogAI(deltaTime) {
            dogAI.nextAction -= deltaTime;
            if (dogAI.earFlick > 0) dogAI.earFlick -= deltaTime;
            if (dogAI.dreamLeft > 0) dogAI.dreamLeft -= deltaTime;
            if (dogAI.eyePeek > 0) dogAI.eyePeek -= deltaTime;
            dogAI.xOffset += (dogAI.targetOffset - dogAI.xOffset) * 0.035;

            if (dogAI.actionLeft > 0) {
                dogAI.actionLeft -= deltaTime;
                if (dogAI.actionLeft <= 0) {
                    dogAI.action = 'rest';
                    dogState = 'lying';
                    dogAI.targetOffset = 0;
                    dogAI.nextAction = randRange(rainActive ? 7000 : 9000, rainActive ? 17000 : 26000);
                }
                return;
            }

            if (dogState === 'lying') {
                if (Math.random() < 0.006) dogAI.earFlick = randRange(250, 700);
                if (Math.random() < 0.002) dogAI.dreamLeft = randRange(1200, 3000);
                if (Math.random() < 0.0018) dogAI.eyePeek = randRange(450, 1200);
            }

            if (dogAI.nextAction <= 0 && currentState !== 'dormido') {
                const action = rainActive ? chooseWeighted([
                    { value: 'shake', weight: 4 },
                    { value: 'cuddle', weight: 5 },
                    { value: 'fire', weight: 2 },
                    { value: 'circle', weight: 2 }
                ]) : chooseWeighted([
                    { value: 'stretch', weight: 3 },
                    { value: 'walk', weight: 3 },
                    { value: 'circle', weight: 3 },
                    { value: 'fire', weight: 2 },
                    { value: 'cuddle', weight: 2 }
                ]);
                dogAI.action = action;
                dogAI.actionLeft = randRange(2500, action === 'walk' ? 5200 : 4300);
                dogState = action === 'circle' ? 'lying' : 'standing';
                dogAI.targetOffset = action === 'fire' ? -18 : (action === 'cuddle' ? -9 : (action === 'walk' ? -12 + Math.random() * 20 : 0));
            }
        }

        const animations = {
            'dormido': { speed: 800, frames: 4, name: "Dormido" },
            'despertar': { speed: 300, frames: 4, loop: false, nextState: 'idle', name: "Despertar" },
            'idle': { speed: 400, frames: 4, name: "Idle Tranquilo" },
            'normal': { speed: 200, frames: 4, name: "Tocando Normal" },
            'alegre': { speed: 120, frames: 4, name: "Taberna Alegre" },
            'epica': { speed: 120, frames: 6, name: "CanciÃ³n Ã‰pica" },
            'nostalgica': { speed: 400, frames: 4, name: "CanciÃ³n NostÃ¡lgica" }
        };

        window.setAnimationState = function(state) {
            currentState = state;
            currentFrame = 0;
            animationTimer = 0;
            bardLife.eyeLook = 0;
            bardLife.blinkStep = 0;
            
            if(state === 'idle' || state === 'dormido' || state === 'despertar' || state === 'nostalgica') {
                 currentInstrument = 'lute';
            } else {
                const rand = Math.random();
                if(rand < 0.6) currentInstrument = 'lute';
                else if(rand < 0.8) currentInstrument = 'flute';
                else currentInstrument = 'drum';
            }

            stateText.textContent = animations[state].name;
            buttons.forEach(btn => btn.classList.remove('active-state'));
            document.getElementById(`btn-${state}`).classList.add('active-state');
        };

        function drawR(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function resolveBardEyes(baseEyes, state) {
            if (state === 'dormido') return 'closed';
            if (bardLife.eventType === 'enjoy') return 'closed';
            if (bardLife.eventType === 'sigh') return 'half';
            if (bardLife.blinkLeft > 0 && bardLife.blinkStep > 35) return 'closed';
            if (bardLife.blinkLeft > 0) return 'half';
            return baseEyes;
        }

        function drawBardEyes(hx, hy, eyes) {
            const look = bardLife.eventType === 'fire' ? -1 : (bardLife.eventType === 'dog' ? 1 : (bardLife.eventType === 'user' ? 0 : bardLife.eyeLook));
            if(eyes === 'closed') {
                drawR(hx - 4, hy - 1, 3, 1, colors.outline); drawR(hx + 1, hy - 1, 3, 1, colors.outline);
            } else if (eyes === 'half') {
                drawR(hx - 4, hy - 2, 3, 1, colors.outline); drawR(hx - 4, hy - 1, 3, 1, colors.skinDark);
                drawR(hx + 1, hy - 2, 3, 1, colors.outline); drawR(hx + 1, hy - 1, 3, 1, colors.skinDark);
            } else {
                drawR(hx - 4, hy - 2, 3, 3, '#fff');
                drawR(hx + 1, hy - 2, 3, 3, '#fff');
                if (look === 0) {
                    drawR(hx - 3, hy - 1, 2, 2, colors.outline); 
                    drawR(hx + 2, hy - 1, 2, 2, colors.outline);
                } else {
                    drawR(look < 0 ? hx - 4 : hx - 2, hy - 1, 1, 2, colors.outline);
                    drawR(look < 0 ? hx + 1 : hx + 3, hy - 1, 1, 2, colors.outline);
                }
                if (look !== 0) {
                    drawR(look < 0 ? hx - 4 : hx - 2, hy - 2, 1, 1, '#fff');
                    drawR(look < 0 ? hx + 1 : hx + 3, hy - 2, 1, 1, '#fff');
                }
            }
        }

        function drawBardMicroDetails(cx, cy, hx, hy, bodyX, bodyY, capeSway) {
            if (frameCounter % 2 === 0) {
                drawR(hx - 7, hy + 3, 2, 1, '#6f615a');
                drawR(hx + 5, hy + 3, 2, 1, '#6f615a');
            }
            drawR(hx - 5, hy + 5, 2, 1, '#8f6f64');
            drawR(hx + 2, hy + 5, 2, 1, '#8f6f64');
            drawR(cx - 11 + capeSway, cy + 2 + bodyY, 2, 9, colors.capeDark);
            drawR(cx + 12 + capeSway, cy + 1 + bodyY, 1, 10, colors.capeDark);
            drawR(cx - 3 + bodyX, cy - 4 + bodyY, 1, 8, '#dadada');
            drawR(cx + 2 + bodyX, cy - 3 + bodyY, 1, 7, '#8f6a42');
        }

        function drawTree() {
            // Capa de fondo: arbol bajo y lateral para no tapar al bardo.
            drawR(38, 8, 5, 40, colors.treeBarkDark);
            drawR(43, 6, 9, 43, colors.treeBark);
            drawR(50, 10, 4, 36, colors.treeBarkDark);
            drawR(46, 8, 2, 38, colors.treeBarkLight);
            drawR(41, 20, 15, 3, colors.treeBarkLight);
            drawR(36, 43, 12, 3, colors.treeBarkDark);
            drawR(49, 43, 17, 3, colors.treeBarkDark);
            drawR(33, 47, 18, 2, colors.treeBark);
            drawR(53, 47, 18, 2, colors.treeBark);

            drawR(22, 2, 33, 12, colors.treeLeafDark);
            drawR(16, 10, 49, 15, colors.treeLeafDark);
            drawR(24, 5, 41, 16, colors.treeLeaf);
            drawR(7, 20, 47, 14, colors.treeLeafDark);
            drawR(18, 18, 55, 16, colors.treeLeaf);
            drawR(29, 25, 35, 11, colors.treeLeafLight);
            drawR(16, 14, 8, 5, colors.treeLeafLight);
            drawR(52, 11, 9, 5, colors.treeLeafLight);
            drawR(37, 4, 10, 3, colors.treeLeafGold);
            drawR(11, 28, 13, 4, colors.treeLeafGold);
            drawR(59, 23, 9, 4, colors.treeLeafGold);
            drawR(31, 34, 30, 3, 'rgba(0,0,0,0.18)');
        }

        function drawRainReactions(hx, hy, cx, cy) {
            if (!rainActive) return;
            if (frameCounter % 18 === 0 && particles.length < 44) {
                particles.push({
                    x: 53 + Math.random() * 34,
                    y: 0,
                    type: 'rain',
                    vx: -0.35,
                    vy: 1.8 + Math.random() * 0.5,
                    life: 1,
                    decay: 0.035
                });
            }
            if (bardLife.rainDropLeft > 0) {
                drawR(hx - 2, hy - 18, 2, 1, colors.rainDrop);
                drawR(hx - 1, hy - 17, 1, 2, colors.rainDrop);
            }
            if (bardLife.eventType === 'cloak') {
                drawR(cx - 15, cy - 3, 4, 16, colors.capeDark);
                drawR(cx + 12, cy - 3, 3, 14, colors.capeDark);
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                if (p.type === 'smoke') {
                    // Movimiento suave de lado a lado mientras sube lentamente al cielo
                    p.vx += Math.sin(p.y / 10 + frameCounter / 40) * 0.005; 
                    let size = Math.floor(1 + (1.0 - p.life) * 3);
                    let opacity = p.life * 0.4;
                    ctx.fillStyle = `rgba(120, 120, 130, ${opacity})`;
                    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), size, size);
                } 
                else if (p.type === 'ember') {
                    // Brasas que flotan lentamente hacia arriba
                    p.vx += Math.sin(p.y / 5 + frameCounter / 20) * 0.01;
                    let opacity = p.life;
                    let size = p.life > 0.5 ? 1 : 1;
                    ctx.fillStyle = `rgba(217, 129, 59, ${opacity})`;
                    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), size, size);
                } else if (p.type === 'rain') {
                    ctx.fillStyle = colors.rainDrop;
                    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 1, 3);
                }
            }
        }

        function generateEnvironmentParticles() {
            const fireX = 22; // Alineado exactamente con la posiciÃ³n de la fogata a la izquierda
            const fireY = 38;

            // Humo lento hacia el cielo
            if (frameCounter % 35 === 0) {
                particles.push({
                    x: fireX - 2 + Math.random() * 4,
                    y: fireY - 4,
                    type: 'smoke',
                    vx: (Math.random() * 0.02 - 0.01),
                    vy: -(0.15 + Math.random() * 0.05), // Velocidad negativa constante (sube lentamente)
                    life: 1.0,
                    decay: 0.003 // Larga vida para alcanzar a subir antes de desaparecer
                });
            }

            // Chispas/Brasas lentas hacia el cielo
            if (frameCounter % 60 === 0 && Math.random() < 0.5) {
                particles.push({
                    x: fireX - 4 + Math.random() * 8,
                    y: fireY,
                    type: 'ember',
                    vx: (Math.random() * 0.04 - 0.02),
                    vy: -(0.2 + Math.random() * 0.1), // Sube lentamente con variaciones
                    life: 1.0,
                    decay: 0.005
                });
            }
        }

        function drawDog(dx, dy, state, frame, timer) {
            let breathe = Math.sin(timer / 300) * 0.3;
            let actionBob = dogAI.action === 'walk' ? Math.sin(timer / 120) : 0;
            let shake = dogAI.action === 'shake' ? Math.round(Math.sin(timer / 45) * 2) : 0;
            dx += dogAI.xOffset + shake;
            ctx.save();

            // Volteamos horizontalmente para que el perrito mire hacia el bardo (izquierda)
            ctx.translate(dx, 0);
            ctx.scale(-1, 1);

            if (state === 'lying') {
                // --- PERRO ACOSTADO (PosiciÃ³n predeterminada/defensiva y relajada) ---
                let headY = 4 + breathe + (dogAI.action === 'circle' ? Math.sin(timer / 130) : 0);
                
                // Cola descansando en el suelo
                const tailLift = dogAI.dreamLeft > 0 ? Math.sin(timer / 90) * 2 : 0;
                drawR(-10, dy + 8 - tailLift, 3, 3, colors.dogDark);
                
                // Cuerpo echado
                drawR(-8, dy + 6, 15, 6, colors.dogDark); 
                drawR(-9, dy + 5, 13, 6, colors.dogLight); 
                drawR(-7, dy + 4, 11, 5, colors.dogHighlight); 

                // Patitas delanteras y traseras estiradas al nivel del suelo
                drawR(-6, dy + 10, 4, 2, colors.dogDark);
                drawR(3,  dy + 10, 4, 2, colors.dogDark);

                // Cabeza baja cerca del suelo
                const hx = 4;
                const hy = dy + headY;
                
                drawR(hx - 2, hy, 9, 6, colors.dogLight);
                drawR(hx - 1, hy - 2, 7, 5, colors.dogHighlight); 
                drawR(hx, hy + 2, 3, 4, colors.dogDark); // Orejita caÃ­da
                
                drawR(hx + 5, hy + 2, 5, 3, colors.dogLight);
                drawR(hx + 8, hy + 2, 2, 2, colors.dogNose); 
                
                // Ojos entrecerrados o parpadeando
                if (currentState === 'dormido' || (dogAI.dreamLeft > 0 && Math.sin(timer / 160) > -0.4)) {
                    drawR(hx + 4, hy + 1, 2, 1, colors.dogNose); 
                } else {
                    drawR(hx + 4, hy, 2, 2, colors.outline);
                    if (dogAI.eyePeek > 0 || dogAI.action !== 'rest') drawR(hx + 5, hy, 1, 1, '#fff');
                }
                if (dogAI.dreamLeft > 0) {
                    drawR(hx - 4, hy - 5, 2, 1, '#fff');
                    drawR(hx - 3, hy - 7, 3, 1, '#fff');
                }
            } 
            else if (state === 'standing') {
                // --- PERRO PARADO (Ocurre ocasionalmente, mira atento) ---
                let headY = breathe + (dogAI.action === 'stretch' ? 2 : 0);
                let tailRot = Math.sin(timer / 100) * 1.5;

                // Cuerpo erguido
                drawR(-8, dy + 2, 14, 10, colors.dogDark); 
                drawR(-9, dy + 1, 12, 10, colors.dogLight); 
                drawR(-7, dy, 10, 8, colors.dogHighlight); 
                
                // Patas levantadas y extendidas
                drawR(-6, dy + 11 + (actionBob > 0 ? 1 : 0), 3, 3, colors.dogDark);
                drawR(2, dy + 11 + (actionBob < 0 ? 1 : 0), 3, 3, colors.dogDark);
                
                // Cola feliz
                drawR(-11, dy + 2 - tailRot, 4, 4, colors.dogHighlight);
                drawR(-12, dy + 3 - tailRot, 2, 2, colors.dogLight);

                // Cabeza en alto
                const hx = 6;
                const hy = dy - 3 + headY;
                
                drawR(hx - 2, hy, 10, 8, colors.dogLight);
                drawR(hx - 1, hy - 2, 8, 6, colors.dogHighlight); 
                drawR(hx, hy + 2, 4, 6, colors.dogDark); // Oreja
                
                drawR(hx + 6, hy + 3, 6, 4, colors.dogLight);
                drawR(hx + 10, hy + 3, 3, 2, colors.dogNose); 
                
                // Ojos abiertos
                drawR(hx + 5, hy + 1, 2, 2, colors.outline); 
                drawR(hx + 6, hy + 1, 1, 1, '#fff'); 
                
                // Lengua sutil
                if (currentState === 'alegre' || currentState === 'epica') {
                    drawR(hx + 6, hy + 6, 2, 2, colors.dogTongue);
                }
                if (dogAI.action === 'shake') {
                    drawR(hx - 5, hy - 3, 2, 1, colors.rainDrop);
                    drawR(hx + 9, hy - 2, 2, 1, colors.rainDrop);
                }
            }

            ctx.restore();
        }
        
        function drawInstrument(lx, ly, type) {
            if (type === 'lute') {
                drawR(lx - 12, ly - 6, 12, 16, colors.luteDark); 
                drawR(lx - 14, ly - 4, 16, 12, colors.luteWood); 
                drawR(lx - 16, ly - 2, 18, 8, colors.luteWood); 
                drawR(lx, ly - 5, 6, 14, colors.luteWood); 
                drawR(lx + 4, ly - 3, 4, 10, colors.luteWood);
                drawR(lx + 8, ly - 2, 18, 5, colors.luteWood);
                drawR(lx + 8, ly + 2, 18, 1, colors.outline); 
                drawR(lx + 26, ly - 4, 6, 7, colors.luteDark);
                drawR(lx + 27, ly - 5, 1, 1, colors.strings); 
                drawR(lx + 29, ly - 5, 1, 1, colors.strings);
                drawR(lx + 28, ly + 3, 1, 1, colors.strings);
                drawR(lx + 30, ly + 3, 1, 1, colors.strings);
                drawR(lx - 5, ly, 4, 5, colors.luteHole);
                drawR(lx - 14, ly, 38, 1, colors.strings);
                drawR(lx - 14, ly + 2, 38, 1, colors.strings);
            } else if (type === 'flute') {
                drawR(lx - 12, ly, 30, 3, colors.fluteDark);
                drawR(lx - 12, ly + 1, 30, 1, colors.fluteLight);
                drawR(lx - 4, ly, 1, 1, colors.outline);
                drawR(lx, ly, 1, 1, colors.outline);
                drawR(lx + 4, ly, 1, 1, colors.outline);
                drawR(lx + 8, ly, 1, 1, colors.outline);
                drawR(lx + 12, ly, 1, 1, colors.outline);
            } else if (type === 'drum') {
                drawR(lx - 8, ly - 2, 16, 14, colors.drumBase);
                drawR(lx - 10, ly - 4, 20, 6, colors.drumTop);
                drawR(lx - 6, ly + 4, 2, 6, colors.drumTop);
                drawR(lx, ly + 4, 2, 6, colors.drumTop);
                drawR(lx + 6, ly + 4, 2, 6, colors.drumTop);
            }
        }

        function drawFireplace(fx, fy, frame) {
            drawR(fx - 14, fy + 12, 28, 4, colors.stoneDark);
            drawR(fx - 12, fy + 10, 24, 2, colors.stoneLight);
            drawR(fx - 16, fy + 14, 32, 2, colors.stoneDark);
            drawR(fx - 10, fy + 8, 20, 4, colors.woodLog);
            drawR(fx - 8, fy + 6, 16, 2, colors.woodLogLight);
            
            let f = frame % 4;
            drawR(fx - 8, fy + 4, 16, 4, colors.fireRed);
            drawR(fx - 6, fy + 2, 12, 4, colors.fireOrange);
            drawR(fx - 4, fy + 4, 8, 2, colors.fireYellow);

            if (f === 0) {
                drawR(fx - 4, fy - 2, 8, 4, colors.fireRed);
                drawR(fx - 2, fy - 6, 4, 8, colors.fireOrange);
                drawR(fx - 1, fy - 4, 2, 6, colors.fireYellow);
                drawR(fx - 8, fy, 4, 4, colors.fireRed);
                drawR(fx + 4, fy + 2, 4, 2, colors.fireRed);
                drawR(fx + 2, fy - 10, 1, 1, colors.fireYellow);
            } else if (f === 1) {
                drawR(fx - 6, fy - 4, 6, 6, colors.fireRed);
                drawR(fx - 4, fy - 8, 4, 6, colors.fireOrange);
                drawR(fx - 3, fy - 6, 2, 4, colors.fireYellow);
                drawR(fx + 2, fy - 2, 6, 4, colors.fireRed);
                drawR(fx + 3, fy - 4, 4, 4, colors.fireOrange);
                drawR(fx - 4, fy - 14, 1, 1, colors.fireOrange);
            } else if (f === 2) {
                drawR(fx - 2, fy - 4, 8, 6, colors.fireRed);
                drawR(fx, fy - 8, 4, 8, colors.fireOrange);
                drawR(fx + 1, fy - 6, 2, 6, colors.fireYellow);
                drawR(fx + 1, fy - 4, 2, 4, colors.fireWhite);
                drawR(fx - 8, fy, 6, 4, colors.fireRed);
                drawR(fx, fy - 12, 1, 1, colors.fireYellow);
            } else if (f === 3) {
                drawR(fx - 4, fy - 2, 10, 4, colors.fireRed);
                drawR(fx - 2, fy - 4, 6, 4, colors.fireOrange);
                drawR(fx - 8, fy - 6, 4, 8, colors.fireRed);
                drawR(fx - 7, fy - 8, 2, 6, colors.fireOrange);
                drawR(fx + 4, fy - 4, 4, 6, colors.fireRed);
                drawR(fx + 6, fy - 10, 1, 1, colors.fireRed);
                drawR(fx - 6, fy - 14, 1, 1, colors.fireYellow);
            }
        }

        function drawBard(state, frame) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            // --- DISEÃ‘O DE COMPOSICIÃ“N BALANCEADO Y SEGURO ---
            const fireX = 22; // Fuego a la izquierda
            const cx = 64;    // Bardo al centro
            const dogX = 106; // Perro a la derecha
            const fireY = 38;
            const cy = 34; 
            const dogY = 52; 

            const currentTime = animationTimer + lastTime;

            drawTree();

            // 1. Dibujar el Fuego
            drawFireplace(fireX, fireY, frame + Math.floor(animationTimer/110)); 

            let headY = 0, headX = 0, armR_Y = 0, armR_X = 0, armL_X = 0; 
            let bodyY = 0, bodyX = 0, footY = 0, footX = 0, luteY = 0, luteX = 0;
            let featherRot = 0, capeSway = 0, smile = false, eyes = 'open';
            let breathY = (state !== 'dormido') ? Math.sin(currentTime / bardLife.breathRate) * bardLife.breathDepth : 0;

            switch(state) {
                case 'dormido':
                    headY = 2; headX = 1; bodyY = 1; armR_Y = 1; featherRot = 2; luteY = 1; capeSway = 1;
                    eyes = 'closed';
                    if(frame === 1 || frame === 2) { headY = 3; bodyY = 2; }
                    break;
                case 'despertar':
                    headY = 3 - frame; eyes = frame === 0 ? 'closed' : (frame === 1 ? 'half' : 'open');
                    featherRot = 2 - (frame * 0.5); break;
                case 'idle':
                    if(frame === 1) { headY = 1; bodyY = 1; featherRot = 1; capeSway = 1; }
                    if(frame === 3) { featherRot = -1; capeSway = -1; }
                    if(frame === 2) eyes = 'half'; break;
                case 'normal':
                    armR_Y = (frame % 2 === 0) ? 0 : 2; armR_X = (frame % 2 === 0) ? 0 : -2;
                    armL_X = (frame === 2) ? 1 : 0; if(frame === 2) headY = 1; 
                    featherRot = (frame % 2 === 0) ? 0 : 1; smile = true; break;
                case 'alegre':
                    armR_Y = (frame % 2 === 0) ? -2 : 3; armR_X = (frame % 2 === 0) ? 1 : -3;
                    headY = (frame % 2 === 0) ? 0 : 1; headX = (frame === 1) ? 1 : (frame === 3 ? -1 : 0);
                    bodyY = (frame === 1 || frame === 3) ? 1 : 0; footY = (frame % 2 === 0) ? -2 : 0; 
                    footX = (frame % 2 === 0) ? 1 : 0; luteY = (frame % 2 === 0) ? 0 : 1;
                    capeSway = (frame % 2 === 0) ? 1 : -2; featherRot = (frame % 2 === 0) ? -1 : 2; smile = true; break;
                case 'epica':
                    armR_Y = [-3, -1, 3, 4, 1, -2][frame]; armR_X = [2, 0, -2, -3, 0, 1][frame];
                    armL_X = [-1, -1, 1, 2, 0, -1][frame]; headY = [-1, -2, 0, 1, 0, -1][frame]; 
                    headX = [-1, -2, 0, 1, 0, -1][frame]; bodyX = [-1, -1, 0, 1, 0, 0][frame]; 
                    luteX = [-1, -1, 0, 1, 0, 0][frame]; luteY = [-1, -2, 0, 2, 0, -1][frame];
                    capeSway = [-2, -3, 1, 3, 0, -1][frame]; footY = (frame === 3 || frame === 4) ? -3 : 0; 
                    featherRot = [-2, -4, 1, 3, 0, -1][frame]; smile = true;
                    eyes = (frame === 1 || frame === 2) ? 'closed' : 'open'; break;
                case 'nostalgica':
                    armR_Y = (frame % 2 === 0) ? 0 : 1; armL_X = (frame === 2) ? 1 : 0; 
                    headY = 1; headX = 1; bodyY = (frame === 1) ? 1 : 0;
                    featherRot = 1; smile = true; eyes = 'half'; break;
            }
            if (bardLife.eventType === 'fire') headX -= 1;
            if (bardLife.eventType === 'dog') headX += 1;
            if (bardLife.eventType === 'user') headY -= 1;
            if (bardLife.eventType === 'rainLook') headY -= 1;
            if (bardLife.eventType === 'smile' || bardLife.eventType === 'enjoy') smile = true;
            if (bardLife.eventType === 'sigh') { headY += 1; breathY += 0.35; }
            if (bardLife.eventType === 'rest') { armR_Y += 2; luteY += 1; }
            if (bardLife.musicMood === 'epica') { bodyY -= 0.5; capeSway -= 1; }
            if (bardLife.musicMood === 'calma') eyes = 'half';
            bodyX += bardLife.postureBias;
            capeSway += bardLife.capeDrift;
            armR_Y += Math.round(breathY * 0.7);
            armL_X += Math.round(Math.sin(currentTime / 760) * 0.4);
            luteY += Math.round(Math.sin(currentTime / 680) * 0.35);
            bardLife.featherLag += (featherRot - bardLife.featherLag) * 0.08;
            featherRot = bardLife.featherLag + Math.sin(currentTime / 430) * 0.35 - (bodyX * 0.2);
            eyes = resolveBardEyes(eyes, state);
            bodyY += breathY;

            // 2. Capa, Banco, Cuerpo del Bardo
            drawR(cx - 12 + capeSway, cy - 6 + bodyY, 26, 22, colors.capeDark);
            drawR(cx - 14 + capeSway, cy - 4 + bodyY, 30, 16, colors.capeLight);

            if (state === 'dormido') {
                let p = (frame + animationTimer / animations[state].speed) % 4;
                if (p > 1.5) {
                    let px = cx - 18 - (p*2); let py = cy - 20 - (p*3);
                    drawR(px, py, 3, 1, '#fff'); drawR(px+1, py+1, 1, 1, '#fff'); drawR(px, py+2, 3, 1, '#fff');
                }
            }

            // Banca de madera
            drawR(cx - 24, cy + 12, 48, 4, colors.benchTop); 
            drawR(cx - 24, cy + 16, 48, 2, colors.benchFront); 
            drawR(cx - 20, cy + 18, 4, 12, colors.benchLegs); 
            drawR(cx + 16, cy + 18, 4, 12, colors.benchLegs); 
            drawR(cx - 18, cy + 22, 36, 2, colors.benchLegs);

            // Piernas y diseÃ±o de botas
            drawR(cx - 10, cy + 12 + bodyY, 8, 12, colors.outline);
            drawR(cx - 9, cy + 12 + bodyY, 6, 12, colors.pants);
            drawR(cx - 7, cy + 13 + bodyY, 2, 10, '#3f3f4e'); // Sombra/diseÃ±o de pantalones
            drawR(cx - 11, cy + 24 + bodyY, 10, 6, colors.bootsLight); 
            drawR(cx - 12, cy + 30 + bodyY, 12, 6, colors.bootsDark);
            drawR(cx - 12, cy + 34 + bodyY, 12, 2, colors.outline);
            drawR(cx - 10, cy + 26 + bodyY, 2, 4, colors.buckle);
            
            drawR(cx + 2, cy + 12 + bodyY, 10, 12, colors.outline);
            drawR(cx + 3, cy + 12 + bodyY, 8, 12, colors.pants);
            drawR(cx + 5, cy + 13 + bodyY, 2, 10, '#3f3f4e');
            drawR(cx + 1 + footX, cy + 24 + bodyY + footY, 12, 8, colors.bootsLight); 
            drawR(cx + 1 + footX, cy + 32 + bodyY + footY, 14, 6, colors.bootsDark); 
            drawR(cx + 11 + footX, cy + 35 + bodyY + footY, 6, 3, colors.bootsDark); 
            drawR(cx + 1 + footX, cy + 36 + bodyY + footY, 16, 2, colors.outline);
            drawR(cx + 4 + footX, cy + 26 + bodyY + footY, 2, 4, colors.buckle);

            // Chaleco y Camisa
            drawR(cx - 8 + bodyX, cy - 6 + bodyY, 16, 16, colors.shirtLight);
            drawR(cx - 10 + bodyX, cy - 6 + bodyY, 6, 14, colors.vestDark); 
            drawR(cx - 9 + bodyX, cy - 6 + bodyY, 4, 14, colors.vestLight);
            drawR(cx + 4 + bodyX, cy - 6 + bodyY, 6, 14, colors.vestDark); 
            drawR(cx + 5 + bodyX, cy - 6 + bodyY, 4, 14, colors.vestLight);
            drawR(cx - 9 + bodyX, cy + 8 + bodyY, 18, 3, colors.belt);
            drawR(cx - 3 + bodyX, cy + 7 + bodyY, 6, 5, colors.buckle);
            drawR(cx - 1 + bodyX, cy + 8 + bodyY, 2, 3, colors.belt); 

            // Cabeza del bardo con barba estilizada y sombrero medieval
            const hx = cx + headX;
            const hy = cy - 18 + headY + bodyY;

            drawR(hx - 8, hy + 2, 16, 6, colors.hair);
            drawR(hx - 8, hy - 2, 3, 4, colors.skinDark); 
            drawR(hx + 5, hy - 2, 3, 4, colors.skinDark); 
            drawR(hx - 6, hy - 5, 12, 12, colors.skinDark); 
            drawR(hx - 5, hy - 4, 10, 10, colors.skinLight); 
            drawR(hx - 5, hy + 4, 10, 3, colors.stubble);
            drawR(hx - 4, hy + 6, 8, 1, colors.skinDark); 
            drawR(hx - 2, hy, 4, 4, colors.skinDark);
            drawR(hx - 1, hy + 1, 2, 2, colors.skinLight); 
            
            drawBardEyes(hx, hy, eyes);

            if(smile) {
                drawR(hx - 3, hy + 4, 6, 2, colors.outline); drawR(hx - 2, hy + 5, 4, 1, '#fff'); 
            } else {
                drawR(hx - 2, hy + 4, 4, 1, colors.outline);
            }

            drawBardMicroDetails(cx, cy, hx, hy, bodyX, bodyY, capeSway);
            drawRainReactions(hx, hy, cx, cy);

            drawR(hx - 9, hy - 8, 18, 4, colors.hatLight); 
            drawR(hx - 8, hy - 12, 16, 5, colors.hatDark); 
            drawR(hx - 6, hy - 14, 12, 3, colors.hatDark);
            drawR(hx - 3, hy - 16 - bardLife.hatAdjust, 6, 2, colors.hatDark); 
            
            let fx = hx - 6; let fly = hy - 14;
            drawR(fx - 1 - featherRot, fly - 6, 3, 6, colors.featherDark);
            drawR(fx - 3 - featherRot, fly - 12, 5, 6, colors.featherLight);
            drawR(fx - 2 - (featherRot*1.5), fly - 16, 4, 4, colors.featherLight);
            drawR(fx - (featherRot*2), fly - 20, 3, 4, colors.featherLight);

            drawR(cx + 8 + armL_X, cy - 4 + bodyY, 10, 8, colors.shirtDark);
            drawR(cx + 10 + armL_X, cy - 3 + bodyY, 8, 6, colors.shirtLight);

            let instX = cx - 2 + luteX;
            let instY = cy + 4 + bodyY + luteY;

            if (currentInstrument === 'flute') {
                instX = cx - 2 + headX; instY = cy - 8 + headY + bodyY;
                armR_X = 2; armR_Y = -6; armL_X = -4; 
            } else if (currentInstrument === 'drum') {
                instX = cx - 6; instY = cy + 14 + bodyY; 
                armL_X = 2; armR_X = -2; 
                if (state === 'normal' || state === 'alegre' || state === 'epica') {
                    armR_Y = (frame % 2 === 0) ? 6 : 0; 
                } else { armR_Y = 2; }
            }

            drawInstrument(instX, instY, currentInstrument);

            // Soporte fÃ­sico inteligente de manos
            if (currentInstrument === 'drum') {
                drawR(instX + 4 + armL_X, instY - 8, 2, 8, colors.drumStick);
                drawR(instX + 3 + armL_X, instY - 10, 4, 3, colors.drumTop);
                drawR(instX + 2 + armL_X, instY - 2, 5, 5, colors.skinLight);
                drawR(instX + 3 + armL_X + bardLife.fingerTap, instY + 1, 2, 1, colors.skinDark);
                drawR(cx - 14 + armR_X, cy - 4 + bodyY + armR_Y, 12, 12, colors.shirtDark);
                drawR(cx - 12 + armR_X, cy - 3 + bodyY + armR_Y, 10, 10, colors.shirtLight);
                drawR(instX - 4 + armR_X, instY - 6 + armR_Y, 2, 10, colors.drumStick);
                drawR(instX - 5 + armR_X, instY - 8 + armR_Y, 4, 3, colors.drumTop);
                drawR(instX - 6 + armR_X, instY - 1 + armR_Y, 6, 6, colors.skinLight);
                drawR(instX - 5 + armR_X - bardLife.fingerTap, instY + 2 + armR_Y, 2, 1, colors.skinDark);
            } else if (currentInstrument === 'flute') {
                drawR(instX + 10 + armL_X, instY - 2, 5, 5, colors.skinLight); 
                drawR(instX + 11 + armL_X, instY - 1, 1, 3, colors.outline); 
                drawR(instX + 13 + armL_X + bardLife.fingerTap, instY, 1, 2, colors.skinDark); 
                drawR(cx - 14 + armR_X, cy - 4 + bodyY + armR_Y, 12, 12, colors.shirtDark);
                drawR(cx - 12 + armR_X, cy - 3 + bodyY + armR_Y, 10, 10, colors.shirtLight);
                drawR(instX - 6 + armR_X, instY - 1 + armR_Y, 6, 6, colors.skinLight);
                drawR(instX - 5 + armR_X, instY + armR_Y, 3, 1, colors.outline); 
                drawR(instX - 3 + armR_X - bardLife.fingerTap, instY + 1 + armR_Y, 1, 2, colors.skinDark); 
            } else {
                drawR(instX + 16 + armL_X, instY - 3, 5, 5, colors.skinLight); 
                drawR(instX + 17 + armL_X, instY - 2, 1, 3, colors.outline); 
                drawR(instX + 19 + armL_X + bardLife.fingerTap, instY - 1, 1, 2, colors.skinDark); 
                drawR(cx - 14 + armR_X, cy - 4 + bodyY + armR_Y, 12, 12, colors.shirtDark);
                drawR(cx - 12 + armR_X, cy - 3 + bodyY + armR_Y, 10, 10, colors.shirtLight);
                drawR(instX - 6 + armR_X, instY - 1 + armR_Y, 6, 6, colors.skinLight);
                drawR(instX - 5 + armR_X, instY + armR_Y, 3, 1, colors.outline); 
                drawR(instX - 3 + armR_X - bardLife.fingerTap, instY + 1 + armR_Y, 1, 2, colors.skinDark); 
            }

            // 3. Dibujar al Perro Poodle (Capa superior absoluta)
            drawDog(dogX, dogY, dogState, frame, currentTime);
            // 3. CAPA FINAL MÃXIMA (Z-INDEX TOP): Dibujar al perro Poodle
            // Esto asegura 100% que NINGÃšN pixel de la banca o del bardo cubra al perrito.
            drawDog(dogX, dogY, dogState, frame, currentTime);

            // 4. Dibujar partÃ­culas (Humo lento, Brasas lentas)
            generateEnvironmentParticles();
            updateAndDrawParticles();
        }

        function runAIStateControllers(deltaTime) {
            frameCounter++;
            dogTimer += deltaTime;
            updateBardMicroLife(deltaTime);
            updateDogAI(deltaTime);

            if (currentState === 'dormido') {
                dogState = 'lying';
                dogAI.action = 'rest';
                dogAI.targetOffset = 0;
            }
        }

        function gameLoop(timestamp) {
            if (!visible) {
                lastTime = timestamp;
                requestAnimationFrame(gameLoop);
                return;
            }
            if (!lastTime) lastTime = timestamp;
            let deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // Si el deltaTime es muy grande (ej. > 200ms), ignoramos el exceso.
            // Esto evita que la animaciÃ³n se acelere al volver de otra pestaÃ±a.
            if (deltaTime > 200) deltaTime = 0;

            const anim = animations[currentState];
            animationTimer += deltaTime;

            runAIStateControllers(deltaTime);

            if (animationTimer >= anim.speed) {
                animationTimer -= anim.speed; 
                currentFrame++;

                if (currentFrame >= anim.frames) {
                    if (anim.loop === false) {
                        setAnimationState(anim.nextState);
                    } else {
                        currentFrame = 0;
                    }
                }
            }

            drawBard(currentState, currentFrame);
            requestAnimationFrame(gameLoop);
        }

        window.__bardoScene = {
            react(type, detail = {}) {
                if (type === 'rain-start') {
                    rainActive = true;
                    sessionMemory.weatherChanges++;
                    startBardEvent('rainLook', 2800);
                    dogAI.action = 'cuddle';
                    dogAI.actionLeft = 3600;
                    dogAI.targetOffset = -9;
                    dogState = 'standing';
                } else if (type === 'rain-stop') {
                    rainActive = false;
                    startBardEvent('smile', 1800);
                } else if (type === 'game-open') {
                    const id = detail.id || 'juego';
                    sessionMemory.openedGames[id] = (sessionMemory.openedGames[id] || 0) + 1;
                    startBardEvent('user', 2600);
                    bardLife.fingerTap = 1;
                } else if (type === 'game-win') {
                    startBardEvent('smile', 3600);
                } else if (type === 'game-lose') {
                    startBardEvent('sigh', 2600);
                } else if (type === 'music') {
                    const mood = detail.mood || 'calma';
                    bardLife.musicMood = mood;
                    sessionMemory.music[mood] = (sessionMemory.music[mood] || 0) + 1;
                }
            },
            getMemory() {
                return { ...sessionMemory, elapsedMs: Date.now() - sessionMemory.startedAt };
            }
        };

        document.addEventListener('visibilitychange', () => {
            visible = !document.hidden;
        });

        window.onload = function() {
            ctx.imageSmoothingEnabled = false;
            requestAnimationFrame(gameLoop);
        };
    </script>
